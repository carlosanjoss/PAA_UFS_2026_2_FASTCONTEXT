[build-system]
requires = [
    "setuptools>=75",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "fastcontext"
version = "0.1.0"
description = "Algorithmic context retrieval for generative AI."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "FastContext Team" },
]

dependencies = [
    "python-dotenv",
    "PyYAML",
    "requests",
    "streamlit",
]


[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]


[project.scripts]
fastcontext = "src.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = [
    "src",
    "src.*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

markers = [
    "integration: tests requiring external services such as Ollama",
]


[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "TRY",
]

ignore = [
    "TRY003",
]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true