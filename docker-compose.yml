services:

  fastcontext:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fastcontext

    working_dir: /app

    volumes:
      - .:/app

    environment:
      PYTHONPATH: /app
      FASTCONTEXT_ENV: development

    ports:
      - "8501:8501"

    stdin_open: true
    tty: true

  tests:
    image: python:3.11-slim

    working_dir: /app

    volumes:
      - .:/app

    environment:
      PYTHONPATH: /app
      FASTCONTEXT_ENV: test

    command:
      - sh
      - -c
      - python -m pip install --no-cache-dir -r requirements.txt
        && python -m pytest -v

    restart: "no"