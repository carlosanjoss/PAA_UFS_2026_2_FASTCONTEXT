[server]
# Sentence Transformers exposes dynamic modules that the default watcher scans
# on semantic initialization, producing irrelevant dependency warnings.
fileWatcherType = "none"

[theme]
base = "light"
primaryColor = "#e11d48"
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#151b2c"
font = "sans serif"
