rag_experiment:
  conditions:
    - no_rag
    - optimized
    - semantic

  corpus:
    chunks_file: "data/chunks/chunks.jsonl"
    expected_chunks: 1305
    expected_fingerprint: "e08b47b55d7237f38bcaba48c79a468a40b92e4f3120e968ae9ece999f5e8c2d"

  queries:
    ground_truth_file: "data/ground_truth/ground_truth.final.json"
    expected_count: 30

  retrieval:
    top_k: 5

  generation:
    provider: "ollama"
    model: "qwen2.5:3b"
    temperature: 0.0
    max_tokens: 256
    think: false
    seed: 42
    citation_retries: 1
    max_truncation_retries: 1
    max_retry_tokens: 256

  warmup:
    enabled: true
    query: "How does FastAPI dependency injection work?"

  reproducibility:
    random_seed: 42
    condition_order: "balanced_rotation"

  checkpoint:
    every_completed_runs: 5

  output:
    directory: "experiments/rag_results"
    csv: "generations.csv"
    jsonl: "generations.jsonl"
    checkpoint: "checkpoint.json"
