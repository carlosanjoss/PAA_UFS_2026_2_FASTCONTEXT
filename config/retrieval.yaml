retrieval:
  defaults:
    top_k: 5

  evaluation_k:
    - 1
    - 3
    - 5
    - 10

  ranking:
    order: "descending"
    tie_breaker: "chunk_id_ascending"

  lexical:
    representation: "tfidf"

    tfidf:
      lowercase: true
      use_idf: true
      smooth_idf: true
      sublinear_tf: true
      norm: "l2"
      stop_words: "english"

      ngram_range:
        min: 1
        max: 2

  algorithms:
    linear:
      enabled: true
      name: "Linear Search"

    indexed:
      enabled: true
      name: "Inverted Index + Binary Search"

    optimized:
      enabled: true
      name: "Inverted Index + Top-K Heap"

    semantic:
      enabled: true
      name: "FAISS Semantic Search"

  sorting:
    primary:
      algorithm: "merge_sort"

    comparison:
      algorithm: "quick_sort"

  inverted_index:
    enabled: true
    sort_vocabulary: true
    binary_search: true

  topk:
    algorithm: "min_heap"

  semantic:
    model:
      name: "BAAI/bge-small-en-v1.5"

    embeddings:
      normalize: true
      dimension: 384

    faiss:
      index_type: "IndexFlatIP"

  rag:
    enabled: true
    default_provider: "ollama"

    ollama:
      model: "qwen2.5:3b"
      fallback_model: "qwen3:1.7b"
      base_url: "http://localhost:11434"

    nvidia:
      enabled: false
      model: ""